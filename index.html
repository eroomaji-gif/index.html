<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สภาพอากาศ - ชลบุรี</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{font-family:'Kanit',system-ui; box-sizing:border-box}
  body{margin:0; min-height:100vh; background: radial-gradient(120% 120% at 20% 10%, #7ec8ff 0%, #3a7bff 40%, #1a2a6c 100%); display:flex; align-items:center; justify-content:center; color:white; padding:16px;}
  .app{width:100%; max-width:420px;}
  
  /* การ์ดหลัก */
  .main-card{background:linear-gradient(180deg, rgba(255,255,255,0.25), rgba(255,255,255,0.08)); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,0.2); border-radius:32px; padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,0.25); text-align:center; position:relative; overflow:hidden;}
  .main-card::before{content:''; position:absolute; top:-80px; right:-80px; width:200px; height:200px; background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%); pointer-events:none;}
  
  .location{display:flex; align-items:center; justify-content:center; gap:6px; font-size:18px; font-weight:600; opacity:0.95;}
  .coords{font-size:11px; opacity:0.6; margin-top:2px; letter-spacing:0.5px;}
  .icon{font-size:80px; margin:10px 0; filter: drop-shadow(0 10px 20px rgba(255,255,255,0.5));}
  .temp{font-size:96px; font-weight:700; line-height:1; letter-spacing:-3px; margin:0;}
  .condition{font-size:18px; margin-top:6px; opacity:0.9;}
  .highlow{font-size:14px; opacity:0.7; margin-top:4px;}

  .details{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:24px;}
  .detail-item{background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.15); border-radius:18px; padding:14px 8px;}
  .detail-item span{display:block; font-size:12px; opacity:0.7;}
  .detail-item b{font-size:18px; font-weight:600; margin-top:2px; display:block;}

  .hourly{margin-top:20px; background:rgba(0,0,0,0.2); backdrop-filter: blur(20px); border-radius:24px; padding:16px; border:1px solid rgba(255,255,255,0.1);}
  .hourly-title{font-size:13px; opacity:0.7; text-align:left; margin-bottom:12px; display:flex; align-items:center; gap:6px;}
  .hourly-grid{display:flex; justify-content:space-between; overflow-x:auto; gap:4px;}
  .hour{flex:1; text-align:center;}
  .hour small{font-size:12px; opacity:0.6; display:block;}
  .hour div{font-size:16px; font-weight:600; margin-top:4px;}

  button.main-btn{width:100%; margin-top:20px; background:white; color:#1a56db; border:none; padding:14px; border-radius:16px; font-weight:600; font-size:15px; cursor:pointer; box-shadow:0 10px 20px rgba(0,0,0,0.15); transition:0.2s;}
  button.main-btn:active{transform:scale(0.97);}

  /* Popup ขออนุญาต */
  #permissionOverlay{position:fixed; inset:0; background:rgba(10,20,50,0.6); backdrop-filter:blur(16px); display:flex; align-items:center; justify-content:center; z-index:99; padding:20px;}
  #permissionBox{background:white; color:#1a2a3a; max-width:340px; width:100%; padding:32px 24px; border-radius:28px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  #permissionBox p{color:#666; font-size:14px; line-height:1.6;}
</style>
</head>
<body>
<div id="permissionOverlay">
  <div id="permissionBox">
    <div style="font-size:56px">🌤️</div>
    <h2 style="margin:12px 0 6px">เช็คอากาศบ้านคุณ</h2>
    <p>เราจะใช้ตำแหน่งเพื่อแสดงอุณหภูมิของจังหวัดที่คุณอยู่จริงๆ แบบเรียลไทม์<br>เราไม่เก็บข้อมูลตำแหน่งของคุณ</p>
    <button class="main-btn" style="background:#1a56db; color:white" onclick="handleAllow()">อนุญาตและเข้าสู่เว็บไซต์</button>
    <button onclick="useBangkok()" style="background:none; border:none; color:#888; margin-top:12px; font-size:13px; cursor:pointer; width:100%">ดูของกรุงเทพฯไปก่อน</button>
  </div>
</div>

<div class="app">
  <div class="main-card">
    <div class="location">📍 <span id="province">กำลังค้นหา...</span></div>
    <div id="coords" class="coords">-</div>
    <div id="icon" class="icon">☀️</div>
    <div id="temp" class="temp">--°</div>
    <div id="weather" class="condition">-</div>
    <div class="highlow" id="status">-</div>
    
    <div class="details">
      <div class="detail-item"><span>รู้สึกเหมือน</span><b id="feel">--°</b></div>
      <div class="detail-item"><span>ความชื้น</span><b id="humid">--%</b></div>
      <div class="detail-item"><span>ลม</span><b id="wind">--</b></div>
    </div>
  </div>

  <div class="hourly">
    <div class="hourly-title">⏰ พยากรณ์รายชั่วโมง (จากโมเดล)</div>
    <div class="hourly-grid" id="hourlyGrid">กำลังโหลด...</div>
  </div>

  <button class="main-btn" onclick="getLocation()">รีเฟรชตำแหน่งอีกครั้ง</button>
</div>

<script>
const icons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',61:'🌧️',63:'🌧️',65:'⛈️',80:'🌦️',95:'⛈️'};
const weatherCodeMap = {0:'ฟ้าใส',1:'ฟ้าใสเป็นส่วนใหญ่',2:'มีเมฆบางส่วน',3:'เมฆครึ้ม',45:'มีหมอก',51:'ฝนปรอยเบา',61:'ฝนเบา',63:'ฝนปานกลาง',65:'ฝนหนัก',80:'ฝนซู่เบา',95:'ฝนฟ้าคะนอง'};

function handleAllow(){
  getLocation();
  document.getElementById('permissionOverlay').style.display='none';
}
function useBangkok(){
  document.getElementById('permissionOverlay').style.display='none';
  fallbackBangkok();
}
function getLocation(){
  document.getElementById('province').innerText='กำลังหาตำแหน่ง...';
  navigator.geolocation.getCurrentPosition(p=>success(p), e=>fallbackBangkok(), {enableHighAccuracy:true});
}
async function success(pos){
  document.getElementById('permissionOverlay').style.display='none';
  const lat=pos.coords.latitude, lon=pos.coords.longitude;
  document.getElementById('coords').innerText=`พิกัด ${lat.toFixed(3)}, ${lon.toFixed(3)}`;
  const rev = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=th`).then(r=>r.json());
  const province = rev.principalSubdivision || rev.city || 'ประเทศไทย';
  document.getElementById('province').innerText = rev.locality ? `${rev.locality}, ${province}` : province;

  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=Asia%2FBangkok`;
  const data = await fetch(url).then(r=>r.json());
  const cur=data.current;
  document.getElementById('temp').innerText=`${Math.round(cur.temperature_2m)}°`;
  document.getElementById('feel').innerText=`${Math.round(cur.apparent_temperature)}°`;
  document.getElementById('humid').innerText=`${cur.relative_humidity_2m}%`;
  document.getElementById('wind').innerText=`${cur.wind_speed_10m} km/h`;
  document.getElementById('weather').innerText=weatherCodeMap[cur.weather_code]||'สภาพอากาศ';
  document.getElementById('icon').innerText=icons[cur.weather_code]||'☀️';
  document.getElementById('status').innerText=`อัพเดทเมื่อ ${new Date().toLocaleTimeString('th-TH')} น.`;

  // ชั่วโมงถัดไป
  let html='';
  for(let i=0; i<5; i++){
    const time = new Date(data.hourly.time[i+1]);
    html+=`<div class="hour"><small>${time.getHours()}:00</small><div>${icons[data.hourly.weather_code[i+1]]||'☀️'}</div><div>${Math.round(data.hourly.temperature_2m[i+1])}°</div></div>`;
  }
  document.getElementById('hourlyGrid').innerHTML=html;
}
function fallbackBangkok(){ success({coords:{latitude:13.7563, longitude:100.5018}}); }
</script>
</body>
</html>
