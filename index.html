<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>เกมตกปลา – เกาะร้าง</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#fff;touch-action:none}
#sky{position:fixed;inset:0;background:linear-gradient(#2f86dc,#bfe6ff)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:7}
#joyzone{position:fixed;left:0;top:18%;bottom:0;width:38%;pointer-events:auto;touch-action:none;z-index:5}
#lookzone{position:fixed;left:38%;right:0;top:0;bottom:0;pointer-events:auto;touch-action:none;z-index:4}
#joy{position:fixed;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);display:none;z-index:6;pointer-events:none}
#knob{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
.hud{position:fixed;z-index:7;pointer-events:none}
#bars{left:calc(8px + env(safe-area-inset-left));top:8px;display:flex;flex-direction:column;gap:4px}
.bar{width:128px;height:13px;background:rgba(0,0,0,.5);border-radius:7px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.25)}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block}
.bar span{position:absolute;left:5px;top:-2px;font-size:10px;line-height:15px;text-shadow:0 0 3px #000}
#hpf{background:#e5484d;width:100%}#fdf{background:#f5a524;width:100%}#o2f{background:#38bdf8;width:100%}
#topinfo{left:50%;top:6px;transform:translateX(-50%);display:flex;gap:8px;font-size:13px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:14px;white-space:nowrap}
#topbtns{right:calc(8px + env(safe-area-inset-right));top:6px;display:flex;gap:6px;pointer-events:auto}
#topbtns button{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:12px;padding:6px 10px;font-size:15px}
#msg{left:50%;top:44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:80vw}
.toast{background:rgba(0,0,0,.65);padding:6px 12px;border-radius:12px;font-size:13px;text-align:center;animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#cross{left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;border:2px solid rgba(255,255,255,.8);display:none}
#prompt{left:50%;bottom:92px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:5px 12px;border-radius:12px;font-size:13px;display:none;white-space:nowrap}
#hotbar{left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
.hb{position:relative;width:52px;height:52px;border-radius:12px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:26px;padding:0;display:flex;align-items:center;justify-content:center}
.hb.on{border-color:#ffd54a;background:rgba(255,213,74,.25)}.hb i{position:absolute;left:4px;top:1px;font-size:10px;font-style:normal;opacity:.7}
.ii{width:34px;height:34px;object-fit:cover;border-radius:8px}.ie{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;font-size:22px}
#buildbar{left:50%;bottom:68px;transform:translateX(-50%);display:none;gap:6px;pointer-events:auto}
#buildbar button{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 10px;font-size:14px}
.abtn{position:fixed;z-index:8;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-size:20px;backdrop-filter:blur(2px)}
#bAct{right:calc(18px + env(safe-area-inset-right));bottom:18px;width:88px;height:88px;background:rgba(255,120,60,.45);font-size:18px}
#bUse{right:122px;bottom:26px;width:62px;height:62px}#bUse.hot{background:rgba(80,220,120,.6);border-color:#8f8}
#bUp{right:30px;bottom:118px;width:58px;height:58px}#bDown{right:98px;bottom:114px;width:58px;height:58px;display:none}
#fishhud{left:50%;bottom:78px;transform:translateX(-50%);width:min(70vw,400px);display:none;flex-direction:column;gap:5px;align-items:stretch}
#fstat{text-align:center;font-size:15px;font-weight:700;text-shadow:0 0 5px #000}#fstat.alert{color:#ff5a5a;animation:bl .3s infinite alternate}
@keyframes bl{to{transform:scale(1.15)}}
.meter{height:14px;background:rgba(0,0,0,.55);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.3)}.meter i{display:block;height:100%;width:0}
#powf{background:linear-gradient(90deg,#4cd964,#ffd54a,#ff5a5a)}#progf{background:#38bdf8}#tensf{background:#4cd964}
#catch{left:50%;top:22%;transform:translate(-50%,-30px);opacity:0;transition:.35s}#catch.show{opacity:1;transform:translate(-50%,0)}
.cc{display:flex;gap:10px;align-items:center;background:rgba(10,14,28,.85);border:2px solid;border-radius:16px;padding:10px 16px;font-size:14px;line-height:1.5}.cc .ie,.cc .ii{width:52px;height:52px;font-size:34px}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;pointer-events:auto;touch-action:pan-y}
.pbox{width:min(96vw,780px);height:min(94vh,540px);background:#141b2b;border:2px solid #34456b;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#1d2840;font-size:15px}.phead span{margin-left:auto;color:#ffd54a}
.x{background:#3a2a2a;border:0;color:#fff;border-radius:8px;padding:4px 10px;font-size:15px}
.ptabs{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;background:#182036;flex-shrink:0}
.ptabs button{background:#243252;border:0;color:#cfd8ef;border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}.ptabs button.on{background:#ffd54a;color:#000}
.pbody{flex:1;overflow-y:auto;padding:8px 10px;-webkit-user-select:text;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid #26324f}.ri{flex-shrink:0}.rt{flex:1;font-size:13px;min-width:0}.rt small{color:#97a3c4}.rr{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.b{background:#2f5fd0;border:0;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap}.b.g{background:#1f9d55}.b:disabled{background:#3a3f4f;color:#888}
.hint{font-size:12px;color:#a9b4d0;line-height:1.5}.sec{margin:10px 0 4px;font-size:13px;color:#ffd54a}.bar2{padding:4px 0}
.eqrow{display:flex;flex-wrap:wrap;gap:6px}.eqb{display:flex;flex-direction:column;align-items:center;gap:2px;background:#243252;border:2px solid transparent;color:#fff;border-radius:10px;padding:6px 10px;font-size:12px}.eqb.on{border-color:#ffd54a;background:#3a4a70}.eqb small{font-size:10px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}.dx{border:2px solid;border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;text-align:center;background:#1b2440}.dx small{font-size:10px;line-height:1.2}
input[type=email],input[type=password]{width:100%;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #3a4a70;background:#0f1524;color:#fff;font-size:14px;-webkit-user-select:text;user-select:text}
#start{position:fixed;inset:0;z-index:50;background:linear-gradient(#0b2a4a,#1b6a9a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px;text-align:center}
#start h1{margin:0;font-size:34px}#start p{margin:0;opacity:.85;font-size:13px}#start div{background:#ffd54a;color:#000;padding:12px 30px;border-radius:24px;font-weight:700;font-size:18px}
#rot{position:fixed;inset:0;z-index:60;background:#0b1424;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="c"></canvas>
<div id="lookzone"></div><div id="joyzone"></div><div id="joy"><div id="knob"></div></div>
<div id="ui">
  <div class="hud" id="bars">
    <div class="bar"><i id="hpf"></i><span>❤️ เลือด</span></div>
    <div class="bar"><i id="fdf"></i><span>🍖 อิ่ม</span></div>
    <div class="bar" id="o2bar" style="display:none"><i id="o2f"></i><span>🫧 ออกซิเจน</span></div>
  </div>
  <div class="hud" id="topinfo"><span id="coin">🪙 0</span><span id="bag">🎒</span><span id="clock"></span></div>
  <div class="hud" id="topbtns"><button id="bBag">🎒</button><button id="bSet">⚙️</button></div>
  <div class="hud" id="msg"></div>
  <div class="hud" id="catch"></div>
  <div class="hud" id="cross"></div>
  <div class="hud" id="prompt"></div>
  <div class="hud" id="fishhud"><div id="fstat"></div><div class="meter" id="powbar" style="display:none"><i id="powf"></i></div>
    <div id="fightbars" style="display:none"><div class="meter" style="margin-bottom:4px"><i id="progf"></i></div><div class="meter"><i id="tensf"></i></div></div></div>
  <div class="hud" id="buildbar"></div>
  <div class="hud" id="hotbar"></div>
</div>
<div class="abtn" id="bAct">ใช้</div><div class="abtn" id="bUse">E</div><div class="abtn" id="bUp">⤒</div><div class="abtn" id="bDown">⬇</div>
<div id="panel"></div>
<input type="file" id="fileIn" accept="image/png,image/*" style="display:none">
<div id="start"><h1>🎣 เกมตกปลา เกาะร้าง</h1><p>หักกิ่งไม้ → แทงปลา → ขาย → ซื้อเบ็ด → ออกสู่ทะเลลึก</p><div>แตะเพื่อเริ่มเล่น</div><p>แนะนำให้เล่นแนวนอน</p></div>
<div id="rot">📱↻<br>กรุณาหมุนจอเป็นแนวนอน</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="model.js"></script>    
<script src="data.js"></script>
<script src="save.js"></script>
<script src="world.js"></script>
  <script src="fishmodel.js"></script>
<script src="game.js"></script>
<script src="creatures.js"></script>
<script src="ui.js"></script>
  <script src="admin.js"></script>
  <script src="adminmode.js"></script>
  <script src="fishtest.js"></script>
  <script src="logphysics.js"></script>
  <script src="fishhold.js"></script>
  <script>setTimeout(()=>alert('GLTF:'+!!THREE.GLTFLoader+' SU:'+!!THREE.SkeletonUtils+' MODELS:'+(window.MODELS?MODELS.list().join(','):'none')+' | '+String(window.buildFish).slice(0,60)),4000)</script>
</body>
</html>
