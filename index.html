<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Live - อากาศสด</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Kanit';box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden; background:#000;}
#scene{position:fixed; inset:0; background:linear-gradient(180deg,#7ec8ff,#fff3be);}
canvas{position:absolute; inset:0; pointer-events:none;}

/* ===== ดวงอาทิตย์ / ดวงจันทร์ (JS เป็นคนขยับตำแหน่ง) ===== */
.orb{position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; pointer-events:none; opacity:0;
  transition:top 20s linear, left 20s linear, opacity 3s ease;}
.orb.noanim{transition:none;}
.sun{width:120px; height:120px; border-radius:50%; background:radial-gradient(circle, #fffde7 0%, #ffeb3b 35%, #ff9800 100%); box-shadow:0 0 60px 30px rgba(255,235,59,0.6), 0 0 120px 60px rgba(255,152,0,0.3); animation:sunFloat 6s ease-in-out infinite; position:relative;}
.sun::after{content:''; position:absolute; inset:-20px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%); animation:pulse 3s infinite;}
@keyframes sunFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.15);opacity:0.3}}
.moon{width:110px; height:110px; margin:5px; filter:drop-shadow(0 0 18px rgba(255,255,255,var(--glow,0.4))); animation:moonFloat 8s ease-in-out infinite;}
.moon svg{width:100%; height:100%; display:block;}
@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.cloud{position:absolute; background:rgba(255,255,255,0.9); border-radius:50px; filter:blur(0.5px); animation: cloudMove linear infinite;}
.cloud.dark{background:rgba(80,90,105,0.9);}
.cloud::before,.cloud::after{content:''; position:absolute; background:inherit; border-radius:50%;}
@keyframes cloudMove{from{transform:translateX(-200px)} to{transform:translateX(120vw)}}

.glass{position:relative; z-index:10; width:90%; max-width:380px; margin:24vh auto 0; background:rgba(15,25,45,0.28); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,0.22); border-radius:28px; padding:22px; text-align:center; color:white; text-shadow:0 1px 6px rgba(0,0,0,0.35); box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.clk-label{font-size:12px; opacity:0.85;}
.clk-time{font-size:38px; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; letter-spacing:1px;}
.clk-date{font-size:13px; opacity:0.9; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.2);}
.temp{font-size:80px; font-weight:700; line-height:1}
.moon-info{font-size:13px; opacity:0.9; margin-top:6px;}
.src{font-size:11px; opacity:0.7; margin-top:10px;}
.water-drop{position:absolute; width:18px; height:26px; background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2)); border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; backdrop-filter:blur(2px); animation: dropSlide 4s linear infinite; pointer-events:none; z-index:20;}
@keyframes dropSlide{0%{transform:translateY(-20px)}100%{transform:translateY(110vh)}}

/* ===== ดาวกลางคืน ===== */
#stars{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 3s ease;}
.star{position:absolute; background:#fff; width:var(--s); height:var(--s);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  opacity:var(--o); animation:starTwinkle var(--d) ease-in-out infinite; animation-delay:var(--dl);}
@keyframes starTwinkle{0%,100%{opacity:calc(var(--o)*0.25); transform:scale(0.7)} 50%{opacity:var(--o); transform:scale(1.1)}}

/* ===== แตะตอนกลางคืน: ดาว ===== */
.tap-star{position:fixed; width:34px; height:34px; background:#fff6b0; z-index:5; pointer-events:none;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation:tapStar 2.2s ease-out forwards;}
@keyframes tapStar{
  0%{transform:translate(-50%,-50%) scale(0) rotate(-90deg); opacity:0}
  20%{transform:translate(-50%,-50%) scale(1.3) rotate(0deg); opacity:1}
  100%{transform:translate(-50%,-50%) scale(0.8) rotate(30deg); opacity:0}
}
/* ===== แตะตอนกลางวัน: ไอร้อน ===== */
.heat{position:fixed; width:80px; height:120px; z-index:5; pointer-events:none; border-radius:50%;
  background:radial-gradient(ellipse at 50% 70%, rgba(255,215,150,0.6) 0%, rgba(255,160,80,0.25) 45%, transparent 70%);
  filter:blur(8px); opacity:0; animation:heatRise 2.4s ease-out forwards;}
@keyframes heatRise{
  0%{transform:translate(-50%,-30%) scale(0.4); opacity:0}
  20%{opacity:1}
  50%{transform:translate(-44%,-90%) scale(1,1.3) skewX(7deg)}
  75%{transform:translate(-56%,-140%) scale(1.1,1.6) skewX(-7deg)}
  100%{transform:translate(-50%,-190%) scale(1.2,1.9); opacity:0}
}
</style>
</head>
<body>
<div id="scene">
  <canvas id="rainCanvas"></canvas>
  <canvas id="windCanvas"></canvas>
  <canvas id="snowCanvas"></canvas>
  <div id="stars"></div>
  <div id="sunWrap" class="orb noanim"><div class="sun"></div></div>
  <div id="moonWrap" class="orb noanim">
    <div class="moon" id="moon">
      <svg viewBox="-50 -50 100 100">
        <defs><radialGradient id="mshade" cx="50%" cy="50%" r="50%"><stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.28"/></radialGradient></defs>
        <circle r="50" fill="#26304d" fill-opacity="0.85"/>
        <g id="moonLit"><path id="moonPath" fill="#f5f3e8"/></g>
        <circle r="50" fill="url(#mshade)"/>
      </svg>
    </div>
  </div>
  <div id="clouds"></div>
  <div id="drops"></div>
</div>

<div class="glass">
  <div class="clk-label">🇹🇭 เวลาประเทศไทย (ICT · UTC+7)</div>
  <div id="clock" class="clk-time">--:--:--</div>
  <div id="date" class="clk-date">-</div>

  <div id="loc" style="font-weight:600">📍 กำลังหา...</div>
  <div id="temp" class="temp">--°</div>
  <div id="cond">-</div>
  <div id="moonInfo" class="moon-info"></div>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px; font-size:13px">
    <div>รู้สึกเหมือน<br><b id="feel">--°</b></div>
    <div>ความชื้น<br><b id="humid">--%</b></div>
    <div>ลม<br><b id="wind">--</b></div>
  </div>
  <div id="src" class="src"></div>
  <button onclick="getLocation()" style="width:100%; margin-top:14px; padding:12px; border-radius:14px; border:none; background:white; color:#1a56db; font-weight:600; cursor:pointer; text-shadow:none">รีเฟรช</button>
</div>

<script>
/* ================= ตัวช่วย ================= */
const H=3600000, DAY=86400000;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=cl(x); return x*x*(3-2*x);};
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgb=c=>`rgb(${c.map(Math.round).join(',')})`;
const $=id=>document.getElementById(id);

/* ================= นาฬิกาไทย (ซิงก์กับเวลาเซิร์ฟเวอร์) ================= */
let clockOffset=0; // ms ที่ต้องบวกให้เวลาเครื่อง
const nowMs=()=>Date.now()+clockOffset;
const fmtT=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const fmtD=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',weekday:'long',day:'numeric',month:'long',year:'numeric'});
async function syncClock(){
  try{
    const t0=Date.now();
    const r=await fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'});
    const t1=Date.now(), d=r.headers.get('Date');
    if(d) clockOffset=new Date(d).getTime()+500-(t0+t1)/2; // Date header ปัดเป็นวินาที จึงบวก 0.5 วิ
  }catch(e){ /* ใช้เวลาเครื่องแทน */ }
}
function tick(){
  const t=new Date(nowMs());
  $('clock').textContent=fmtT.format(t);
  $('date').textContent=fmtD.format(t);
  setTimeout(tick,1000-(nowMs()%1000)+5);
}

/* ================= ดวงจันทร์: คำนวณจากตำแหน่งจริงของดวงอาทิตย์และดวงจันทร์ ================= */
function moonState(ms){
  const n=ms/DAY+2440587.5-2451545.0, r=Math.PI/180;
  const L=280.460+0.9856474*n, g=(357.528+0.9856003*n)*r;
  const ls=L+1.915*Math.sin(g)+0.020*Math.sin(2*g);                 // ลองจิจูดดวงอาทิตย์
  const Lm=218.316+13.176396*n, Mp=(134.963+13.064993*n)*r, D=(297.850+12.190749*n)*r;
  const lm=Lm+6.289*Math.sin(Mp)+1.274*Math.sin(2*D-Mp)+0.658*Math.sin(2*D)+0.214*Math.sin(2*Mp)-0.186*Math.sin(g); // ลองจิจูดดวงจันทร์
  const psi=(((lm-ls)%360)+360)%360;                                  // มุมห่างจากดวงอาทิตย์ (0=เดือนดับ, 180=เต็มดวง)
  const k=Math.cos(psi*r);
  return {psi,k,frac:(1-k)/2,waxing:psi<180};
}
function moonName(psi){
  if(psi<10||psi>=350) return 'เดือนดับ';
  if(psi<80) return 'เสี้ยวข้างขึ้น';
  if(psi<100) return 'ครึ่งดวงข้างขึ้น';
  if(psi<170) return 'นูนข้างขึ้น';
  if(psi<190) return 'เต็มดวง';
  if(psi<260) return 'นูนข้างแรม';
  if(psi<280) return 'ครึ่งดวงข้างแรม';
  return 'เสี้ยวข้างแรม';
}
function drawMoon(m){
  const rx=Math.abs(m.k)*50;
  // ซีกสว่าง: ขอบขวาเต็ม + เส้นแบ่งแสง-เงา (วงรี) ; ข้างแรมกลับด้านซ้าย
  $('moonPath').setAttribute('d',`M0,-50 A50,50 0 0 1 0,50 A${rx.toFixed(2)},50 0 0 ${m.k>0?0:1} 0,-50 Z`);
  $('moonLit').setAttribute('transform',m.waxing?'':'scale(-1,1)');
  $('moon').style.setProperty('--glow',(0.15+m.frac*0.55).toFixed(2));
  $('moonInfo').innerText=`🌙 พระจันทร์ ${Math.round(m.frac*100)}% · ${moonName(m.psi)}`;
}

/* ================= เวลาพระอาทิตย์ขึ้น-ตก ================= */
function defaultSun(){
  const base=Math.floor((Date.now()+7*H)/DAY)*DAY-7*H; // เที่ยงคืนเวลาไทย
  return {sr:base+6*H, ss:base+18*H};
}
let S=Object.assign(defaultSun(),{L:1});
let W={code:0,precip:0,wind:0,temp:30,feel:30,cf:0};

/* ================= สีท้องฟ้า ================= */
const NIGHT=[[4,7,18],[20,30,56]];
const MORNING=[[135,175,225],[252,238,210]];      // เช้า: ฟ้าอ่อน-ครีม ไม่ร้อน
const DUSK=[[110,80,150],[255,150,100]];
const GRAY=[[100,112,128],[150,158,168]];
const GRAY_RAIN=[[66,78,92],[105,116,130]];
const HEAT=[ // [อุณหภูมิ(รู้สึกเหมือน), สีบน, สีล่าง] ยิ่งร้อนยิ่งส้ม-แดง ยิ่งเย็นยิ่งฟ้าอ่อนปนเหลือง
  [22,[120,190,245],[255,243,190]],
  [30,[100,175,245],[255,236,170]],
  [35,[255,185,100],[255,225,140]],
  [40,[240,110,50],[255,170,80]],
  [45,[215,55,35],[255,120,60]]];
function heatColor(T){
  if(T<=HEAT[0][0]) return [HEAT[0][1],HEAT[0][2]];
  for(let i=1;i<HEAT.length;i++){
    if(T<=HEAT[i][0]){ const a=HEAT[i-1],b=HEAT[i],k=(T-a[0])/(b[0]-a[0]); return [mix(a[1],b[1],k),mix(a[2],b[2],k)]; }
  }
  const e=HEAT[HEAT.length-1]; return [e[1],e[2]];
}

/* ================= วาดฉากตามเวลา (เรียกทุก 20 วินาที) ================= */
function render(){
  const t=nowMs(), tw=40*60000;
  while(t>S.sr+DAY){ S.sr+=DAY; S.ss+=DAY; }
  const {sr,ss}=S;

  // ระดับแสง 0 (มืด) – 1 (สว่าง)
  const L=sm(cl((t-(sr-tw))/(2*tw)))*sm(cl(1-(t-(ss-tw))/(2*tw)));
  S.L=L;

  // ตำแหน่งดวงอาทิตย์
  let a;
  if(t>=sr&&t<=ss) a=Math.sin((t-sr)/(ss-sr)*Math.PI);
  else a=-Math.min(1,(t<sr?sr-t:t-ss)/tw);
  const p=(t-sr)/(ss-sr);
  const sun=$('sunWrap');
  sun.style.top=(14+(1-a)*70)+'%';
  sun.style.left=(22+56*cl(p))+'%';
  sun.style.opacity=a<0?Math.max(0,1+a*2.2):1;

  // ตำแหน่งดวงจันทร์: ขึ้นหลังฟ้ามืด ลงก่อนฟ้าสว่าง
  let pSs=null,nSr=null;
  if(t>ss){pSs=ss;nSr=sr+DAY;} else if(t<sr){pSs=ss-DAY;nSr=sr;}
  const moon=$('moonWrap'); let moonVis=0;
  if(pSs!==null){
    const m=(((t-pSs)/(nSr-pSs))-0.06)/0.88;
    const ma=(m>=0&&m<=1)?Math.sin(m*Math.PI):(m<0?m*3:-(m-1)*3);
    moon.style.top=(14+(1-ma)*70)+'%';
    moon.style.left=(25+50*cl(m))+'%';
    moonVis=ma<0?Math.max(0,1+ma*3.3):1;
  }else{ moon.style.top='95%'; }
  moon.style.opacity=moonVis;
  const ms=moonState(t);
  drawMoon(ms);

  // ดาว
  $('stars').style.opacity=cl(1-L*1.6)*(1-W.cf*0.8);

  // สีพื้นหลัง: เช้า / กลางวัน(ตามอุณหภูมิ) / กลางคืน
  const dayC=heatColor(W.feel);
  const wm=t<ss?1-sm((t-(sr+1*H))/(2*H)):0;                       // น้ำหนักช่วงเช้า
  let light=[mix(dayC[0],MORNING[0],wm),mix(dayC[1],MORNING[1],wm)];
  const dw=cl(1-Math.abs(t-(ss-5*60000))/(70*60000));              // น้ำหนักช่วงเย็น
  light=[mix(light[0],DUSK[0],0.6*dw),mix(light[1],DUSK[1],0.6*dw)];
  const gr=W.precip>0?GRAY_RAIN:GRAY, g=cl(W.cf*0.9);
  light=[mix(light[0],gr[0],g),mix(light[1],gr[1],g)];
  const nb=mix(NIGHT[1],[48,64,104],0.35*ms.frac*moonVis);
  const top=mix(NIGHT[0],light[0],L), bot=mix(nb,light[1],L);
  $('scene').style.background=`linear-gradient(180deg, ${rgb(top)} 0%, ${rgb(bot)} 100%)`;
}

/* ================= แตะที่พื้นหลัง: กลางคืน=ดาว / กลางวัน=ไอร้อน ================= */
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('.glass')) return;
  const scene=$('scene');
  if(S.L<0.45){
    const t=document.createElement('div'); t.className='tap-star';
    t.style.left=e.clientX+'px'; t.style.top=e.clientY+'px';
    scene.appendChild(t); setTimeout(()=>t.remove(),2300);
  }else{
    for(let i=0;i<3;i++){
      const h=document.createElement('div'); h.className='heat';
      h.style.left=(e.clientX+(i-1)*18)+'px'; h.style.top=e.clientY+'px';
      h.style.animationDelay=(i*0.2)+'s';
      scene.appendChild(h); setTimeout(()=>h.remove(),3000);
    }
  }
});

/* ================= ดาวพื้นหลัง (สร้างครั้งเดียว) ================= */
function buildStars(){
  const box=$('stars'); box.innerHTML='';
  for(let i=0;i<45;i++){
    const y=Math.pow(Math.random(),1.8)*65;
    const bell=(Math.random()+Math.random()+Math.random()-1.5)/1.5;
    const x=50+bell*48;
    const o=Math.max(0,1-y/65)*0.9;
    if(o<0.08) continue;
    const s=document.createElement('div'); s.className='star';
    s.style.left=x+'%'; s.style.top=y+'%';
    s.style.setProperty('--s',(3+Math.random()*5)+'px');
    s.style.setProperty('--o',o.toFixed(2));
    s.style.setProperty('--d',(1.5+Math.random()*2.5)+'s');
    s.style.setProperty('--dl',(Math.random()*3)+'s');
    box.appendChild(s);
  }
}

/* ================= เมฆ ================= */
function createClouds(count, dark){
  const box=$('clouds'); box.innerHTML='';
  for(let i=0;i<count+2;i++){
    const c=document.createElement('div');
    c.className='cloud'+(dark?' dark':'');
    c.style.top=`${10+Math.random()*35}%`;
    c.style.width=`${80+Math.random()*120}px`;
    c.style.height=`${30+Math.random()*30}px`;
    c.style.left=`${Math.random()*100}%`;
    c.style.animationDuration=`${20+Math.random()*40}s`;
    c.style.animationDelay=`${Math.random()*5}s`;
    c.style.opacity=dark?'0.7':'0.85';
    if(i==0 && !dark){ c.style.top='14%'; c.style.left='52%'; c.style.animation='none'; c.style.width='140px'; c.style.transform='translateX(-50%)'; }
    box.appendChild(c);
  }
}

/* ================= เอฟเฟกต์ฝน / ลม / หิมะ ================= */
let rainAnim;
function startRain(){
  stopRain();
  const canvas=$('rainCanvas'); const ctx=canvas.getContext('2d');
  canvas.width=innerWidth; canvas.height=innerHeight;
  const drops=Array.from({length:200},()=>({x:Math.random()*canvas.width, y:Math.random()*canvas.height, l:Math.random()*15+10, v:Math.random()*8+8}));
  const waterBox=$('drops'); waterBox.innerHTML='';
  for(let i=0;i<12;i++){ const d=document.createElement('div'); d.className='water-drop'; d.style.left=Math.random()*100+'%'; d.style.animationDelay=Math.random()*3+'s'; waterBox.appendChild(d); }
  function loop(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5; drops.forEach(p=>{ ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-2,p.y+p.l); ctx.stroke(); p.y+=p.v; if(p.y>canvas.height){p.y=-20; p.x=Math.random()*canvas.width;} }); rainAnim=requestAnimationFrame(loop); } loop();
}
function stopRain(){ cancelAnimationFrame(rainAnim); const c=$('rainCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); $('drops').innerHTML=''; }

let windAnim;
function startWind(speed){
  stopWind();
  const canvas=$('windCanvas'); const ctx=canvas.getContext('2d');
  canvas.width=innerWidth; canvas.height=innerHeight;
  const lines=Array.from({length:Math.min(80, speed*2)},()=>({x:Math.random()*canvas.width, y:Math.random()*canvas.height, v:speed/3+2}));
  function loop(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; lines.forEach(l=>{ ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(l.x+30,l.y+2); ctx.stroke(); l.x+=l.v; if(l.x>canvas.width){l.x=-30; l.y=Math.random()*canvas.height;} }); windAnim=requestAnimationFrame(loop); } loop();
}
function stopWind(){ cancelAnimationFrame(windAnim); const c=$('windCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); }

let snowAnim;
function startSnow(){
  stopSnow();
  const canvas=$('snowCanvas'); const ctx=canvas.getContext('2d');
  canvas.width=innerWidth; canvas.height=innerHeight;
  const flakes=Array.from({length:80},()=>({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*3+1, v:Math.random()*1.5+0.5}));
  function loop(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='rgba(255,255,255,0.8)'; flakes.forEach(f=>{ ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); f.y+=f.v; if(f.y>canvas.height){f.y=-10; f.x=Math.random()*canvas.width;} }); snowAnim=requestAnimationFrame(loop); } loop();
}
function stopSnow(){ cancelAnimationFrame(snowAnim); const c=$('snowCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); }

/* ================= สภาพอากาศ ================= */
const WX={0:'ฟ้าใส แดดจัด',1:'ฟ้าใสเป็นส่วนใหญ่',2:'มีเมฆบางส่วน',3:'เมฆครึ้ม',45:'หมอก',48:'หมอกน้ำค้างแข็ง',
  51:'ฝนปรอยเบา',53:'ฝนปรอย',55:'ฝนปรอยหนาแน่น',56:'ฝนปรอยเยือกแข็ง',57:'ฝนปรอยเยือกแข็งหนัก',
  61:'ฝนเบา',63:'ฝนปานกลาง',65:'ฝนหนัก',66:'ฝนเยือกแข็ง',67:'ฝนเยือกแข็งหนัก',
  71:'หิมะเบา',73:'หิมะปานกลาง',75:'หิมะหนัก',77:'เกล็ดหิมะ',
  80:'ฝนซู่เบา',81:'ฝนซู่',82:'ฝนซู่หนัก',85:'หิมะโปรยเบา',86:'หิมะโปรยหนัก',
  95:'พายุฝนฟ้าคะนอง',96:'พายุฝนฟ้าคะนอง มีลูกเห็บ',99:'พายุฝนฟ้าคะนอง ลูกเห็บหนัก'};
function cloudFactor(code,precip){
  if(precip>0) return 0.9;
  if(code>=95) return 0.95;
  if(code>=51) return 0.8;
  const m={0:0,1:0.1,2:0.35,3:0.65,45:0.6,48:0.6};
  return m[code]??0.5;
}
function applyWeather(c,utcOffset,sunrise,sunset){
  const precip=c.precipitation||0;
  W={code:c.weather_code,precip,wind:c.wind_speed_10m,temp:c.temperature_2m,feel:c.apparent_temperature,cf:cloudFactor(c.weather_code,precip)};
  $('temp').innerText=`${Math.round(c.temperature_2m)}°`;
  $('feel').innerText=`${Math.round(c.apparent_temperature)}°`;
  $('humid').innerText=`${c.relative_humidity_2m}%`;
  $('wind').innerText=`${c.wind_speed_10m} km/h`;
  $('cond').innerText=precip>0?`${WX[c.weather_code]||'ฝนตก'} (ฝนตกอยู่ ${precip} มม.)`:(WX[c.weather_code]||'สภาพอากาศ');
  $('src').innerText=`ข้อมูลอากาศ ${String(c.time).slice(11,16)} น. (เวลาท้องถิ่น) · Open-Meteo`;

  // เวลาพระอาทิตย์ขึ้น-ตกของพื้นที่นั้น (แปลงเป็น UTC ด้วย offset ของพื้นที่)
  if(sunrise&&sunset){
    S.sr=Date.parse(sunrise+':00Z')-utcOffset*1000;
    S.ss=Date.parse(sunset+':00Z')-utcOffset*1000;
  }

  const dark=W.cf>=0.6;
  createClouds(Math.round(W.cf*6),dark);
  if(precip>0) startRain(); else stopRain();
  if(W.wind>15) startWind(W.wind); else stopWind();
  if(W.temp<=15) startSnow(); else stopSnow();
  render();
}

let coords=null;
async function load(lat,lon,name){
  coords={lat,lon,name};
  try{
    if(!name){
      try{
        const rev=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=th`).then(r=>r.json());
        coords.name=`${rev.locality||''} ${rev.principalSubdivision||''}`.trim();
      }catch(e){ coords.name=''; }
    }
    $('loc').innerText=`📍 ${coords.name||'ตำแหน่งของคุณ'}`;
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day,precipitation&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
    const data=await fetch(url).then(r=>r.json());
    applyWeather(data.current,data.utc_offset_seconds,data.daily.sunrise[0],data.daily.sunset[0]);
  }catch(e){
    $('cond').innerText='โหลดข้อมูลอากาศไม่สำเร็จ';
  }
}
function getLocation(){
  $('loc').innerText='📍 กำลังหาตำแหน่ง...';
  if(!navigator.geolocation){ load(13.7563,100.5018,'กรุงเทพมหานคร'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>load(pos.coords.latitude,pos.coords.longitude,null),
    ()=>load(13.7563,100.5018,'กรุงเทพมหานคร'),
    {timeout:10000,maximumAge:300000});
}

/* ================= เริ่มทำงาน ================= */
buildStars();
syncClock().then(()=>{ tick(); render(); setTimeout(()=>document.querySelectorAll('.orb').forEach(o=>o.classList.remove('noanim')),100); });
render();
setInterval(render,20000);                                              // ขยับฟ้า/ดวงอาทิตย์/ดวงจันทร์
setInterval(()=>{ if(coords) load(coords.lat,coords.lon,coords.name); },10*60000); // อัปเดตอากาศทุก 10 นาที
setInterval(syncClock,10*60000);                                        // ซิงก์นาฬิกาใหม่
getLocation();
</script>
