<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แคลนฟรีไฟร์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#14110f;--card:#211b17;--line:#3a2e26;--tx:#f5ece4;--mut:#a39587;--ac:#ff7a1a;--ac2:#ffc247;--off:#4a4440}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Kanit,system-ui,sans-serif;line-height:1.5;padding-bottom:40px}
.marquee{background:var(--ac);color:#1a0e04;overflow:hidden;white-space:nowrap;padding:10px 0;font-weight:800;font-size:1.5rem}
.marquee span{display:inline-block;padding-left:100%;animation:run 18s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.marquee span{animation:none;padding-left:12px}}
header{text-align:center;padding:28px 16px 8px}
#logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--ac2);background:var(--card)}
h1{margin:8px 0 0;font-size:2.2rem;font-weight:800}
main{max-width:760px;margin:0 auto;padding:0 16px}
section{margin-top:28px}
h2{font-size:1.25rem;margin:0 0 12px;border-left:5px solid var(--ac);padding-left:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;margin-bottom:8px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac2)}
button{background:var(--ac);color:#1a0e04;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--line)}
button:disabled{background:var(--off);color:var(--mut);cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg)}
.rc div{padding:12px}
.rc b{display:block}.time{color:var(--ac2);font-weight:600;margin:4px 0 10px}
.rc button{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.msg{border-bottom:1px solid var(--line);padding:10px 0}.msg small{color:var(--mut)}
a{color:var(--ac2)}
.hide{display:none}.err{color:#ff7b6b;min-height:1.4em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--mut)}
</style>
</head>
<body>
<script>
/* ===== ตั้งค่าตรงนี้ ===== */
const SUPABASE_URL = "ใส่ลิงก์ Supabase ที่นี่";
const SUPABASE_KEY = "ใส่ anon key ที่นี่";
const DISCORD_WEBHOOK = "ใส่ Discord webhook ที่นี่";
const CLAN_NAME = "ชื่อแคลนของคุณ";
const CLAN_LOGO = ""; // ลิงก์รูปโลโก้
</script>

<div class="marquee"><span id="ann">กำลังโหลด...</span></div>
<header>
  <img id="logo" alt="โลโก้แคลน">
  <h1 id="cname"></h1>
</header>

<main>
  <section id="authBox" class="box">
    <h2>เข้าสู่ระบบ</h2>
    <input id="u" placeholder="ชื่อผู้ใช้" autocomplete="username">
    <input id="p" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" autocomplete="current-password">
    <div class="row"><button onclick="login()">เข้าสู่ระบบ</button><button class="alt" onclick="signup()">สมัครสมาชิก</button></div>
    <div class="err" id="aerr"></div>
  </section>

  <div id="app" class="hide">
    <div class="top"><span>สวัสดี <b id="me"></b></span><button class="alt" onclick="logout()">ออกจากระบบ</button></div>

    <section><h2>ของรางวัล</h2><div class="grid" id="rewards"></div></section>

    <section><h2>แนะนำตัว</h2><div class="box">
      <div class="row"><input id="f_real" placeholder="ชื่อจริง"><input id="f_nick" placeholder="ชื่อเล่น"></div>
      <div class="row"><input id="f_ff" placeholder="ชื่อในเกมฟรีไฟร์"><input id="f_uid" placeholder="UID ฟรีไฟร์" inputmode="numeric"></div>
      <button onclick="saveIntro()">แนะนำตัว</button> <span id="iok"></span>
    </div></section>

    <section><h2>กล่องจดหมาย</h2><div class="box" id="inbox">ไม่มีข้อความ</div></section>

    <section id="admin" class="hide"><h2>หัวหน้าแคลน</h2><div class="box">
      <b>เพิ่มของรางวัล</b>
      <input id="r_title" placeholder="ชื่อของรางวัล">
      <input id="r_img" placeholder="ลิงก์รูปภาพ">
      <input id="r_hours" type="number" step="any" min="0" placeholder="หมดอายุในกี่ชั่วโมง">
      <button onclick="addReward()">เพิ่มการ์ด</button>
      <hr style="border-color:var(--line);margin:16px 0">
      <b>ข้อความวิ่งด้านบน</b>
      <input id="a_txt" placeholder="ข้อความกิจกรรม">
      <button onclick="setAnn()">บันทึกข้อความ</button>
      <hr style="border-color:var(--line);margin:16px 0">
      <b>ส่งจดหมายหาสมาชิก</b>
      <input id="m_to" placeholder="ชื่อผู้ใช้ผู้รับ">
      <textarea id="m_body" rows="3" placeholder="ข้อความ"></textarea>
      <input id="m_link" placeholder="ลิงก์ (ไม่ใส่ก็ได้)">
      <button onclick="sendMsg()">ส่งจดหมาย</button> <span id="mok"></span>
    </div></section>
  </div>
</main>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user = null, profile = null, isAdmin = false, rewards = [], myClaims = new Set();

$("cname").textContent = CLAN_NAME; document.title = CLAN_NAME;
if (CLAN_LOGO) $("logo").src = CLAN_LOGO; else $("logo").style.display = "none";

/* ชื่อผู้ใช้ -> อีเมลจำลอง (ผู้ใช้ไม่ต้องกรอกอีเมล) */
const fakeEmail = n => "u" + Array.from(new TextEncoder().encode(n.trim().toLowerCase())).map(b => b.toString(16).padStart(2, "0")).join("") + "@clan.local";

async function hook(embed) {
  try { await fetch(DISCORD_WEBHOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ embeds: [embed] }) }); } catch (e) { console.error(e); }
}

async function signup() {
  const n = $("u").value.trim(), p = $("p").value;
  if (!n || p.length < 6) return $("aerr").textContent = "ใส่ชื่อผู้ใช้ และรหัสผ่านอย่างน้อย 6 ตัว";
  const { data, error } = await db.auth.signUp({ email: fakeEmail(n), password: p });
  if (error) return $("aerr").textContent = "สมัครไม่ได้: " + error.message;
  if (!data.session) return $("aerr").textContent = "ปิด Confirm email ใน Supabase ก่อน";
  const { error: e2 } = await db.from("profiles").insert({ id: data.user.id, username: n });
  if (e2) { await db.auth.signOut(); return $("aerr").textContent = "ชื่อนี้ถูกใช้แล้ว"; }
  boot();
}
async function login() {
  const { error } = await db.auth.signInWithPassword({ email: fakeEmail($("u").value), password: $("p").value });
  if (error) return $("aerr").textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
  boot();
}
async function logout() { await db.auth.signOut(); location.reload(); }

async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return;
  user = session.user;
  const { data: pr } = await db.from("profiles").select("*").eq("id", user.id).single();
  profile = pr;
  if (!profile) return logout();
  const { data: ad } = await db.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
  isAdmin = !!ad;
  $("authBox").classList.add("hide"); $("app").classList.remove("hide");
  $("me").textContent = profile.username;
  if (isAdmin) $("admin").classList.remove("hide");
  $("f_real").value = profile.real_name || ""; $("f_nick").value = profile.nickname || "";
  $("f_ff").value = profile.ff_name || ""; $("f_uid").value = profile.ff_uid || "";
  loadAnn(); loadRewards(); loadInbox();
}

async function loadAnn() {
  const { data } = await db.from("announcements").select("text").eq("id", 1).single();
  $("ann").textContent = data?.text || "";
  $("a_txt").value = data?.text || "";
}
async function setAnn() { await db.from("announcements").update({ text: $("a_txt").value }).eq("id", 1); loadAnn(); }

async function loadRewards() {
  const [r, c] = await Promise.all([
    db.from("rewards").select("*").order("created_at", { ascending: false }),
    db.from("claims").select("reward_id").eq("user_id", user.id)
  ]);
  rewards = r.data || []; myClaims = new Set((c.data || []).map(x => x.reward_id));
  $("rewards").innerHTML = rewards.length ? rewards.map(x => `
    <div class="rc"><img src="${esc(x.image_url)}" alt=""><div>
      <b>${esc(x.title)}</b><div class="time" id="t${x.id}"></div>
      <button id="b${x.id}" onclick="claim(${x.id})">กดรับ</button>
      ${isAdmin ? `<button class="alt" style="margin-top:6px" onclick="delReward(${x.id})">ลบการ์ด</button>` : ""}
    </div></div>`).join("") : "<div class='box'>ยังไม่มีของรางวัล</div>";
  tick();
}
function tick() {
  const now = Date.now();
  rewards.forEach(x => {
    const t = $("t" + x.id), b = $("b" + x.id); if (!t) return;
    const left = new Date(x.expires_at) - now;
    if (myClaims.has(x.id)) { t.textContent = "คุณรับแล้ว"; b.disabled = true; b.textContent = "รับแล้ว"; }
    else if (left <= 0) { t.textContent = "หมดเวลาแล้ว"; b.disabled = true; b.textContent = "หมดอายุแล้ว"; }
    else {
      const s = Math.floor(left / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
      t.textContent = "เหลือ " + [h, m, sec].map(n => String(n).padStart(2, "0")).join(":");
      b.disabled = false; b.textContent = "กดรับ";
    }
  });
}
setInterval(tick, 1000);

async function claim(id) {
  const x = rewards.find(r => r.id === id);
  if (!x || new Date(x.expires_at) <= Date.now() || myClaims.has(id)) return;
  const { error } = await db.from("claims").insert({ reward_id: id, user_id: user.id, username: profile.username });
  if (error) { myClaims.add(id); return tick(); }
  myClaims.add(id); tick();
  hook({ title: "🎁 มีคนกดรับของรางวัล", description: `**${profile.username}** กดรับ **${x.title || "ของรางวัล"}** แล้ว`, color: 0xff7a1a, image: { url: x.image_url }, timestamp: new Date().toISOString() });
}
async function addReward() {
  const h = parseFloat($("r_hours").value);
  if (!$("r_img").value || !(h > 0)) return alert("ใส่ลิงก์รูปและจำนวนชั่วโมง");
  await db.from("rewards").insert({ title: $("r_title").value, image_url: $("r_img").value.trim(), expires_at: new Date(Date.now() + h * 3600e3).toISOString() });
  ["r_title", "r_img", "r_hours"].forEach(i => $(i).value = ""); loadRewards();
}
async function delReward(id) { if (confirm("ลบการ์ดนี้?")) { await db.from("rewards").delete().eq("id", id); loadRewards(); } }

async function saveIntro() {
  const v = { real_name: $("f_real").value, nickname: $("f_nick").value, ff_name: $("f_ff").value, ff_uid: $("f_uid").value };
  const { error } = await db.from("profiles").update(v).eq("id", user.id);
  if (error) return $("iok").textContent = "บันทึกไม่สำเร็จ";
  $("iok").textContent = "บันทึกแล้ว ✓";
  hook({ title: "👤 สมาชิกแนะนำตัว", color: 0xffc247, fields: [
    { name: "ชื่อผู้ใช้", value: profile.username || "-", inline: true }, { name: "ชื่อจริง", value: v.real_name || "-", inline: true },
    { name: "ชื่อเล่น", value: v.nickname || "-", inline: true }, { name: "ชื่อในเกม", value: v.ff_name || "-", inline: true },
    { name: "UID", value: v.ff_uid || "-", inline: true }], timestamp: new Date().toISOString() });
}

async function loadInbox() {
  const { data } = await db.from("messages").select("*").eq("to_user", user.id).order("created_at", { ascending: false });
  if (!data?.length) return;
  $("inbox").innerHTML = data.map(m => `<div class="msg"><small>${esc(m.from_name)} · ${new Date(m.created_at).toLocaleString("th-TH")}</small><div>${esc(m.body)}</div>
    ${/^https?:\/\//.test(m.link || "") ? `<a href="${esc(m.link)}" target="_blank" rel="noopener">เปิดลิงก์</a>` : ""}</div>`).join("");
}
async function sendMsg() {
  const { data: t } = await db.from("profiles").select("id").eq("username", $("m_to").value.trim()).maybeSingle();
  if (!t) return $("mok").textContent = "ไม่พบชื่อผู้ใช้นี้";
  const { error } = await db.from("messages").insert({ to_user: t.id, from_name: profile.username, body: $("m_body").value, link: $("m_link").value.trim() || null });
  $("mok").textContent = error ? "ส่งไม่สำเร็จ" : "ส่งแล้ว ✓";
  if (!error) { $("m_body").value = ""; $("m_link").value = ""; }
}

boot();
</script>
</body>
</html>
