<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<title>Chatbot AI</title>
<style>
  :root{--bg:#12151c;--panel:#1a1e28;--ai:#2a2f3a;--blue:#3b6fe0;--muted:#8b93a4;--text:#fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .hidden{display:none!important}

  /* Login */
  #login{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px}
  #login h1{margin:0 0 18px;font-size:28px}
  .btn{width:100%;max-width:320px;height:52px;border-radius:12px;font-size:16px}
  .btn.primary{background:var(--blue)}
  .btn.ghost{background:var(--panel);border:1px solid #2c3242}
  #loginErr{color:#ff8a80;font-size:13px;max-width:320px;text-align:center;min-height:18px}

  /* App */
  #app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid #1f2430}
  header h2{margin:0;font-size:18px;font-weight:600}
  .icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px}
  #avatar{background:linear-gradient(135deg,#3b6fe0,#c04fd0);font-size:16px;font-weight:600}
  #msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .row{display:flex;align-items:flex-end;gap:8px}
  .row.user{justify-content:flex-end}
  .logo{width:28px;height:28px;border-radius:50%;background:#1e3a5f;display:grid;place-items:center;
    font-size:11px;font-weight:700;flex:none}
  .bubble{max-width:78%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
  .user .bubble{background:var(--blue);border-bottom-right-radius:4px}
  .ai .bubble{background:var(--ai);border-bottom-left-radius:4px}
  .typing{color:var(--muted);font-size:14px;margin-left:36px}
  .empty{margin:auto;color:var(--muted);text-align:center}

  .inputbar{display:flex;align-items:center;gap:8px;padding:10px 12px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1f2430;background:var(--bg)}
  .inputbar textarea{flex:1;resize:none;max-height:120px;background:var(--panel);color:var(--text);
    border:1px solid #2c3242;border-radius:12px;padding:11px 12px;font:inherit;outline:none}
  #send{width:44px;height:44px;border-radius:12px;background:var(--blue);font-size:22px}
  #send:disabled{opacity:.4}
  #plus{width:40px;height:40px;border-radius:50%;border:1.5px solid #fff;font-size:22px;line-height:1}
  #micBtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:var(--panel);border:1px solid #2c3242;color:var(--text);transition:.2s}
  #micBtn:active{background:#232a38}
  #micBtn.recording{background:#e0433b;border-color:#e0433b;color:#fff;animation:micPulse 1.1s ease-in-out infinite}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,67,59,.5)}50%{box-shadow:0 0 0 8px rgba(224,67,59,0)}}

  /* Drawer */
  #scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:5}
  #drawer{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--bg);z-index:6;
    transform:translateX(-100%);transition:.25s;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));
    display:flex;flex-direction:column;border-right:1px solid #1f2430}
  #app.open #drawer{transform:none}
  #app.open #scrim{opacity:1;pointer-events:auto}
  #newChat{height:48px;border-radius:10px;background:var(--blue);font-size:16px;margin-top:40px}
  #drawer h3{margin:26px 0 8px;font-size:14px;color:var(--muted);font-weight:500}
  #list{overflow-y:auto;flex:1}
  #list button{display:block;width:100%;text-align:left;padding:12px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #list button.active{color:#8fb0ff}

  #toast{position:absolute;left:12px;right:12px;bottom:84px;background:#3a2020;color:#ffb4ab;padding:12px 14px;
    border-radius:10px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:.25s}
  #toast.show{opacity:1}









  
</style>






  
</head>
<body>

<!-- ============ หน้า Login ============ -->
<div id="login">
  <h1>Chatbot AI</h1>
  <button class="btn primary" id="googleBtn">Sign in with Google</button>
  <button class="btn ghost" id="guestBtn">ใช้งานแบบไม่ล็อกอิน (เก็บในเครื่อง)</button>
  <div id="loginErr"></div>
</div>

<!-- ============ หน้าแชท ============ -->
<div id="app" class="hidden">
  <header>
    <button class="icon" id="menuBtn" aria-label="Chat history">☰</button>
    <h2>Chatbot AI</h2>
    <button class="icon" id="avatar" aria-label="Profile">U</button>
  </header>

  <div id="msgs"></div>

  <div class="inputbar">
    <button id="plus" aria-label="Add">+</button>

    <button id="send" aria-label="Send" disabled>↑</button>
  </div>

  <div id="scrim"></div>
  <aside id="drawer">
    <button id="newChat">＋ New Chat</button>

    <div id="list"></div>
  </aside>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ================= ตั้งค่า ================= */
const API_BASE = "https://ai-uvix.onrender.com/";
const CHAT_PATH = "chat";            // TODO: แก้ให้ตรงกับ endpoint หลังบ้านของคุณ

// Firebase (สำหรับ Google Sign-In + ซิงก์แชท) ต้องเปิด Google provider และเพิ่มโดเมนเว็บใน
// Firebase Console > Authentication > Settings > Authorized domains
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBeZlSKjWKoqftgnvxMUxZqOS7gPntyB9c",
  authDomain: "ai-hascor-4678c.firebaseapp.com",
  projectId: "ai-hascor-4678c",
  // appId: "..."   // ถ้าสร้าง Web app ใน Firebase ให้ใส่ appId ตรงนี้
};

/* ================= ตัวช่วย ================= */
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),4000); }

/* ================= Store: Local (guest) ================= */
class LocalStore {
  constructor(key){ this.key="chatbotai:"+key; this.data=JSON.parse(localStorage.getItem(this.key)||'{"chats":[]}'); this.cbC=null; this.cbM=null; this.cur=null; }
  save(){ localStorage.setItem(this.key, JSON.stringify(this.data)); }
  listenChats(cb){ this.cbC=cb; this.emitChats(); }
  emitChats(){ this.cbC && this.cbC(this.data.chats.map(({id,title,updatedAt})=>({id,title,updatedAt}))); }
  listenMessages(id, cb){ this.cur=id; this.cbM=cb; this.emitMsgs(); }
  emitMsgs(){ const c=this.data.chats.find(x=>x.id===this.cur); this.cbM && this.cbM(c?c.messages:[]); }
  async newChat(){ const c={id:uid(),title:"New Chat",updatedAt:Date.now(),messages:[]}; this.data.chats.push(c); this.save(); return c.id; }
  async addMessage(chatId,m,title){
    const c=this.data.chats.find(x=>x.id===chatId); c.messages.push({...m,id:uid()});
    c.updatedAt=m.timestamp; if(title) c.title=title; this.save(); this.emitChats(); if(chatId===this.cur) this.emitMsgs();
  }
  stop(){}
}

/* ================= Store: Firestore (ซิงก์กับบัญชี Google) ================= */
class CloudStore {
  constructor(user){ this.col=firebase.firestore().collection("users").doc(user.uid).collection("chats"); this.unsubC=null; this.unsubM=null; }
  listenChats(cb){
    this.unsubC=this.col.orderBy("updatedAt","desc").onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>toast("ซิงก์ไม่สำเร็จ: "+e.message));
  }
  listenMessages(id, cb){
    this.unsubM && this.unsubM();
    this.unsubM=this.col.doc(id).collection("messages").orderBy("timestamp","asc")
      .onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))));
  }
  async newChat(){ const r=this.col.doc(); await r.set({title:"New Chat",updatedAt:Date.now()}); return r.id; }
  async addMessage(chatId,m,title){
    const ref=this.col.doc(chatId);
    await ref.collection("messages").add(m);
    await ref.update({updatedAt:m.timestamp, ...(title?{title}:{})});
  }
  stop(){ this.unsubC&&this.unsubC(); this.unsubM&&this.unsubM(); }
}

/* ================= API (แค่ส่ง-รับ ไม่มีสมองกลในหน้าเว็บ) ================= */
async function callApi(chatId, message, history){
  if(!navigator.onLine) throw new Error("ไม่มีอินเทอร์เน็ต");
  // แปลง history ในเครื่อง (sender: "USER"/"AI") ให้เป็นฟอร์แมตที่ backend ต้องการ (sender: "user"/"ai")
  const historyForApi = (history||[]).map(m=>({
    sender: /^user$/i.test(m.sender) ? "user" : "ai",
    message: m.message
  }));
  const body = JSON.stringify({chatId, message, history: historyForApi, timestamp: Date.now()});
  let lastErr;
  for(let attempt=0; attempt<2; attempt++){
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),90000); // Render ตื่นช้าได้ถึง ~60 วิ
    try{
      const res = await fetch('https://ai-uvix.onrender.com/api/chat', {method: "POST", headers: {"Content-Type": "application/json"}, body});
      
      clearTimeout(t);
      if(!res.ok) throw new Error("เซิร์ฟเวอร์ตอบกลับผิดพลาด ("+res.status+")");
      return parse(await res.text());
    }catch(e){
      clearTimeout(t); lastErr=e;
      if(attempt===0) await new Promise(r=>setTimeout(r,2000));
    }
  }
  throw lastErr.name==="AbortError" ? new Error("เซิร์ฟเวอร์ใช้เวลานานเกินไป") :
        (lastErr instanceof TypeError ? new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (อาจติด CORS ที่หลังบ้าน)") : lastErr);
}
function parse(text){
  const now=Date.now(); const ai=s=>({sender:"AI",message:String(s),timestamp:now});
  let o; try{ o=JSON.parse(text); }catch{ return [ai(text.trim())]; }
  if(Array.isArray(o.messages)) return o.messages.map(m=>({sender:/^user$/i.test(m.sender)?"USER":"AI",message:m.message||"",timestamp:m.timestamp||now}));
  // รองรับรูปที่ backend เจนกลับมา: { reply, images: ["data:image/png;base64,..."] }
  if(Array.isArray(o.images) && o.images.length){
    return [{sender:"AI", message:o.reply||"", images:o.images, timestamp:now}];
  }
  for(const k of ["reply","response","message","answer","text","content"]) if(typeof o[k]==="string") return [ai(o[k])];
  return [ai(text.trim())];
}

/* ================= อ่านออกเสียง (TTS) ================= */
let currentUtterance = null;
function speakText(text, btn){
  if(!('speechSynthesis' in window)) return;
  if(btn.classList.contains('speaking')){
    speechSynthesis.cancel();
    return;
  }
  speechSynthesis.cancel();
  document.querySelectorAll('.tts-btn.speaking').forEach(b=>b.classList.remove('speaking'));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'th-TH';
  u.onend = u.onerror = () => btn.classList.remove('speaking');
  currentUtterance = u;
  btn.classList.add('speaking');
  speechSynthesis.speak(u);
}

/* ================= State / UI ================= */
let store=null, user=null, currentChat=null, sending=false, chatsCache=[];




  
function renderChats(chats){
  chatsCache=chats;
  const list=$("list"); list.innerHTML="";
  [...chats].sort((a,b)=>b.updatedAt-a.updatedAt).forEach(c=>{   // ใหม่สุดอยู่บน
    const b=document.createElement("button"); b.textContent=c.title;
    if(c.id===currentChat) b.className="active";
    b.onclick=()=>{ openChat(c.id); toggleDrawer(false); };
    list.appendChild(b);
  });
}
function renderMessages(msgs){
const box=$("msgs"); box.innerHTML="";
  if(!msgs.length && !sending){ box.innerHTML='<div class="empty">เริ่มคุยกับ AI ได้เลย</div>'; return; }
  [...msgs].sort((a,b)=>a.timestamp-b.timestamp).forEach(m=>{     // เก่า -> ใหม่
    const r=document.createElement("div"); const isUser=m.sender==="USER";
    r.className="row "+(isUser?"user":"ai");
    if(!isUser){ const l=document.createElement("div"); l.className="logo"; l.textContent="AI"; r.appendChild(l); }
    const b=document.createElement("div"); b.className="bubble";
    if(m.message) b.textContent=m.message;
    if(Array.isArray(m.images)){
      m.images.forEach(src=>{
        const img=document.createElement("img");
        img.src=src; img.style.maxWidth="100%"; img.style.borderRadius="10px";
        img.style.display="block"; img.style.marginTop=m.message?"8px":"0";
        b.appendChild(img);
      });
  }
    r.appendChild(b);
    if(!isUser && m.message && 'speechSynthesis' in window){
      const ttsBtn=document.createElement('button');
      ttsBtn.className='tts-btn';
      ttsBtn.innerHTML='🔊 อ่านออกเสียง';
      ttsBtn.onclick=()=>speakText(m.message, ttsBtn);
      b.appendChild(ttsBtn);
    }
    box.appendChild(r);
  });
  if(sending){ const t=document.createElement("div"); t.className="typing"; t.textContent="AI กำลังพิมพ์…"; box.appendChild(t); }
  box.scrollTop=box.scrollHeight;                                  // Auto-scroll
}
let lastMsgs=[];
function openChat(id){
  currentChat=id;
  if(id===null){ lastMsgs=[]; store.cur=null; renderMessages([]); renderChats(chatsCache); return; }
  store.listenMessages(id, m=>{ lastMsgs=m; renderMessages(m); });
  renderChats(chatsCache);
}
function toggleDrawer(open){ $("app").classList.toggle("open",open); }



async function sendMessage(){
  const input=$("input"); const text=input.value.trim();
  if(!text||sending) return;
  input.value=""; input.style.height="auto"; $("send").disabled=true;
  sending=true;
  try{
    const first = currentChat===null;
    if(first){ currentChat=await store.newChat(); openChat(currentChat); }
    const id=currentChat;
    const historySnapshot=[...lastMsgs]; // ประวัติก่อนหน้าข้อความใหม่นี้ (ไว้ส่งให้ AI จำบริบท)
    await store.addMessage(id,{sender:"USER",message:text,timestamp:Date.now()}, first?text.slice(0,40):null);
    renderMessages(lastMsgs);
    const replies=await callApi(id,text,historySnapshot);
    for(const r of replies) await store.addMessage(id,r);
  }catch(e){ toast(e.message||"ส่งข้อความไม่สำเร็จ"); }
  finally{ sending=false; renderMessages(lastMsgs); $("send").disabled=!$("input").value.trim(); }
}



  
  

function startApp(s, displayName){
  store=s; currentChat=null; lastMsgs=[];
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("avatar").textContent=(displayName||"U").trim().charAt(0).toUpperCase()||"U";
  store.listenChats(renderChats);
  renderMessages([]);
}
function logout(){
  if(!confirm("ออกจากระบบ?")) return;
  store&&store.stop(); store=null; toggleDrawer(false);
  if(user){ firebase.auth().signOut(); user=null; }
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
}

/* ================= Events ================= */
$("menuBtn").onclick=()=>toggleDrawer(true);
$("scrim").onclick=()=>toggleDrawer(false);
$("newChat").onclick=()=>{ openChat(null); toggleDrawer(false); };
$("avatar").onclick=logout;
$("plus").onclick=()=>toast("ฟีเจอร์แนบไฟล์ยังไม่เปิดใช้งาน");
$("send").onclick=sendMessage;
$("input").addEventListener("input",e=>{
  e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";
  $("send").disabled=sending||!e.target.value.trim();
});
$("input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>700){ e.preventDefault(); sendMessage(); }});

$("guestBtn").onclick=()=>startApp(new LocalStore("guest"),"G");

let fbReady=false;
try{
  if(typeof firebase!=="undefined"){
    firebase.initializeApp(FIREBASE_CONFIG); fbReady=true;
    firebase.auth().onAuthStateChanged(u=>{ if(u&&!store){ user=u; startApp(new CloudStore(u),u.displayName||u.email); } });
  }
}catch(e){ console.warn(e); }

$("googleBtn").onclick=async()=>{
  $("loginErr").textContent="";
  if(!fbReady){ $("loginErr").textContent="โหลด Firebase ไม่สำเร็จ (ตรวจอินเทอร์เน็ต) — ใช้แบบไม่ล็อกอินไปก่อนได้"; return; }
  if(location.protocol==="file:"){ $("loginErr").textContent="Google Sign-In ใช้ไม่ได้เมื่อเปิดไฟล์จากเครื่อง ต้องอัปโหลดขึ้นเว็บโฮสต์ (เช่น GitHub Pages) — ใช้แบบไม่ล็อกอินไปก่อนได้"; return; }
  try{ await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e){ $("loginErr").textContent="ล็อกอินไม่สำเร็จ: "+(e.code||e.message); }
};



/* --- สร้างปุ่มไมค์ไอคอนสไตล์ Gemini --- */
const micBtn = document.createElement('button');
micBtn.id = 'micBtn';
micBtn.type = 'button';
micBtn.title = 'พูดเพื่อพิมพ์';

// ไอคอนไมค์ SVG แบบเรียบหรู
micBtn.innerHTML = `
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
    <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
    <line x1="12" x2="12" y1="19" y2="22"></line>
  </svg>
`;


// แทรกปุ่มไมค์ไว้ก่อนปุ่มส่ง (#send) ในแถว .inputbar เดิม

const sendBtn = $('send');
sendBtn.parentNode.insertBefore(micBtn, sendBtn);

// ระบบ Voice-to-Text
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'th-TH';
  recognition.continuous = true;
  recognition.interimResults = true;
  let isRecording = false;
  let baseValue = '';
  let finalTranscript = '';

  micBtn.onclick = async () => {
    if (isRecording) { recognition.stop(); return; }

    // ขอ permission ไมค์ก่อนอย่างชัดเจน (บาง browser ต้องการแบบนี้ ไม่งั้น start() จะเงียบ)
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop()); // ขอแค่เช็ค permission ไม่ได้ใช้ stream นี้จริง
    } catch (permErr) {
      toast('ไม่ได้รับอนุญาตให้ใช้ไมค์ครับ (เช็ค permission ในตั้งค่า browser)');
      return;
    }

    const inputField = $('input');
    baseValue = inputField.value ? inputField.value + ' ' : '';
    finalTranscript = '';
    try { recognition.start(); }
    catch (e) {
      toast('เริ่มฟังไม่สำเร็จ: ' + (e.message || e));
    }
  };

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
  };

  recognition.onresult = (event) => {
    let interimTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += transcript + ' ';
      else interimTranscript += transcript;
    }
    const inputField = $('input');
    inputField.value = baseValue + finalTranscript + interimTranscript;
    inputField.style.height = 'auto';
    inputField.style.height = Math.min(inputField.scrollHeight, 120) + 'px';
    sendBtn.disabled = sending || !inputField.value.trim();
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
  };

  recognition.onerror = (e) => {
    isRecording = false;
    micBtn.classList.remove('recording');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      toast('ไม่ได้รับอนุญาตให้ใช้ไมค์ครับ');
    } else if (e.error === 'no-speech') {
      // เงียบไปเฉยๆ ไม่ต้องเตือน ผู้ใช้แค่ยังไม่พูด
    } else {
      toast('ไมค์มีปัญหา: ' + e.error);
    }
  };
} else {
  micBtn.style.display = 'none';
    }

  
</script>
